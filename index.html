<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÍMICA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <script src="words.js"></script>
    <main>
        <section id="config" class="screen active">
            <h1 class="title">MÍMICA</h1>
            <div id="player-config">
                <input type="text" id="input-player" class="player" placeholder="Nome do jogador">
                <button id="btn-add" class="btn">+</button>
                <button id="btn-send" class="btn">Enviar</button>
            </div>
    
            <ul id="players-list"></ul>
            <p id="msg-err"></p>
            <div id="teams-box" class="teams-box">
                <div class="team-container">
                    <table>
                        <thead>
                            <tr><th>Equipe 1</th><th>Equipe 2</th></tr>
                        </thead>
                        <tbody>
                            <tr id="team-1"></tr>
                            <tr id="team-2"></tr>
                        </tbody>
                    </table>
                </div>

            </div>
            <div id="shuffle-box">
                <button id="btn-shuffle">Embaralhar Times</button>
            </div>
    
            <div id="start-box">
                <button id="btn-start">Começar</button>
            </div>
        </section>

        <section id="screen-game" class="screen">
            <p class="playerName"><span id="current-player"></span></p>
            <p id="current-team" class="subtitle"></p>
            <div class="show-words">
                <button id="btn-words" class="btn-show btn">MOSTRAR PALAVRAS</button>
                <button id="btn-next">PRÓXIMO JOGADOR
                <i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div id="word-box">
                <ul id="words-list"></ul>
            </div>
            <div id="timer"></div>
            <div id="endgame">
                <button id="btn-endgame">FINALIZAR JOGO</button>
            </div>
            <div>
                <p class="subtitle">SCORE</p>
                <div id="score-box">
                    <div class="box-team">
                        <span class="team-text">TIME 1</span>
                        <span id="score-time1"></span>
                    </div>
                    <div class="box-team">
                        <span class="team-text">TIME 2</span>
                        <span id="score-time2"></span>
                    </div>
                </div>
            </div>
        </section>

        <section id="screen-round" class="screen">
            <h1>PONTUAÇÃO</h1>
            <button onclick="showScreen('screen-scores')">Terminar</button>
        </section>
        <section id="screen-scores" class="screen">
            <h1>Pontuação</h1>
            <button onclick="showScreen('screen-game')">Próxima vez</button>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
